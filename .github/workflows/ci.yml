name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: ESLint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:check

  format:
    name: Prettier Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier
        run: npm run format:check

  notify_discord:
    name: Discord Notification
    runs-on: ubuntu-latest
    needs: [lint, format]
    if: always()
    permissions:
      actions: read
      contents: read

    steps:
      - name: Send Discord embed
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          LINT_RESULT="${{ needs.lint.result }}"
          FORMAT_RESULT="${{ needs.format.result }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Debugging
          echo "Lint: $LINT_RESULT"
          echo "Format: $FORMAT_RESULT"
          echo "Webhook URL présent: $([ -n "$DISCORD_WEBHOOK" ] && echo 'oui' || echo 'non')"

          if [ "$LINT_RESULT" = "success" ] && [ "$FORMAT_RESULT" = "success" ]; then
            COLOR=3066993
            TITLE="✅ Code Quality OK"
            DETAILS="Lint et Format sont passés avec succès."
          else
            COLOR=15158332
            TITLE="❌ Code Quality FAILED"
            DETAILS="Lint ou Format est en erreur."
          fi

          # Échapper les caractères JSON correctement
          PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "$TITLE",
              "color": $COLOR,
              "fields": [
                { "name": "📦 Repo", "value": "$REPO", "inline": true },
                { "name": "🌿 Branche", "value": "$BRANCH", "inline": true },
                { "name": "👤 Auteur", "value": "$ACTOR", "inline": true },
                { "name": "🔍 Détails", "value": "$DETAILS" }
              ],
              "url": "$URL",
              "footer": {
                "text": "GitHub Actions • Code Quality"
              },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
            }]
          }
          EOF
          )

          # Envoyer le webhook avec gestion d'erreur
          HTTP_RESPONSE=$(curl -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            -w "\n%{http_code}" \
            -s \
            "$DISCORD_WEBHOOK")

          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)

          if [ "$HTTP_CODE" -ne 204 ]; then
            echo "Erreur Discord: HTTP $HTTP_CODE"
            echo "$HTTP_RESPONSE"
            exit 1
          else
            echo "Message Discord envoyé avec succès!"
          fi
