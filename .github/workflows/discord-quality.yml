name: Discord Code Quality (Embed)

on:
  workflow_run:
    workflows: ["Code Quality"]
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Send Discord embed
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          ACTOR="${{ github.event.workflow_run.actor.login }}"
          URL="${{ github.event.workflow_run.html_url }}"

          # Debugging
          echo "Conclusion: $CONCLUSION"
          echo "Webhook URL présent: $([ -n "$DISCORD_WEBHOOK" ] && echo 'oui' || echo 'non')"

          if [ "$CONCLUSION" = "success" ]; then
            COLOR=3066993
            TITLE="✅ Code Quality OK"
            DETAILS="Lint et Format sont passés avec succès."
          else
            COLOR=15158332
            TITLE="❌ Code Quality FAILED"
            DETAILS="Lint ou Format est en erreur."
          fi

          # Échapper les caractères JSON correctement
          PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "$TITLE",
              "color": $COLOR,
              "fields": [
                { "name": "📦 Repo", "value": "$REPO", "inline": true },
                { "name": "🌿 Branche", "value": "$BRANCH", "inline": true },
                { "name": "👤 Auteur", "value": "$ACTOR", "inline": true },
                { "name": "🔍 Détails", "value": "$DETAILS" }
              ],
              "url": "$URL",
              "footer": {
                "text": "GitHub Actions • Code Quality"
              },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
            }]
          }
          EOF
          )

          # Envoyer le webhook avec gestion d'erreur
          HTTP_RESPONSE=$(curl -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            -w "\n%{http_code}" \
            -s \
            "$DISCORD_WEBHOOK")

          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)

          if [ "$HTTP_CODE" -ne 204 ]; then
            echo "Erreur Discord: HTTP $HTTP_CODE"
            echo "$HTTP_RESPONSE"
            exit 1
          else
            echo "Message Discord envoyé avec succès!"
          fi
