services:
    db:
        image: mariadb:11.4
        container_name: restaurant-db
        restart: unless-stopped
        env_file:
            - .env
        environment:
            MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
            MARIADB_DATABASE: ${DB_NAME}
            MARIADB_USER: ${DB_USER}
            MARIADB_PASSWORD: ${DB_PASSWORD}
        volumes:
            - db_data:/var/lib/mysql
            - ./bdd/docker-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
        healthcheck:
            test:
                [
                    'CMD',
                    'mariadb-admin',
                    'ping',
                    '-h',
                    '127.0.0.1',
                    '-u',
                    '${DB_USER}',
                    '-p${DB_PASSWORD}',
                ]
            interval: 10s
            timeout: 5s
            retries: 10

    api:
        build:
            context: .
            dockerfile: DockerFile
        container_name: restaurant-api
        restart: unless-stopped
        env_file:
            - .env
        environment:
            DB_HOST: db
            DB_PORT: 3306
            PORT: 3000
        depends_on:
            db:
                condition: service_healthy
        ports:
            - '3000:3000'

volumes:
    db_data:
